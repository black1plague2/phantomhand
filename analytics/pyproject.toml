[project]
name = "opus-analytics"
version = "0.1.0"
description = "OPUS movement-quality analytics: loaders, schema validation, segmentation, filtering, metrics"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.0"]

[tool.setuptools.packages.find]
include = ["opus_analytics*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
