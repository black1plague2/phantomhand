name: Contracts Validation

on:
  push:
    branches: [ main, master ]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      working-directory: contracts
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate all fixtures
      working-directory: contracts
      run: python validate.py

    - name: Check for required fixture files
      working-directory: contracts
      run: |
        test -f fixtures/valid/game-manifest.1.json || exit 1
        test -f fixtures/valid/game-manifest.2.json || exit 1
        test -f fixtures/invalid/game-manifest.1.json || exit 1
        test -f fixtures/invalid/game-manifest.2.json || exit 1
        test -f fixtures/valid/event.1.json || exit 1
        test -f fixtures/valid/event.2.json || exit 1
        test -f fixtures/invalid/event.1.json || exit 1
        test -f fixtures/invalid/event.2.json || exit 1
        test -f fixtures/valid/kinematics-chunk.1.json || exit 1
        test -f fixtures/valid/kinematics-chunk.2.json || exit 1
        test -f fixtures/invalid/kinematics-chunk.1.json || exit 1
        test -f fixtures/invalid/kinematics-chunk.2.json || exit 1
        test -f fixtures/valid/session-envelope.1.json || exit 1
        test -f fixtures/valid/session-envelope.2.json || exit 1
        test -f fixtures/invalid/session-envelope.1.json || exit 1
        test -f fixtures/invalid/session-envelope.2.json || exit 1
        test -f fixtures/valid/program.1.json || exit 1
        test -f fixtures/valid/program.2.json || exit 1
        test -f fixtures/invalid/program.1.json || exit 1
        test -f fixtures/invalid/program.2.json || exit 1
        test -f fixtures/valid/program.orchard.json || exit 1
